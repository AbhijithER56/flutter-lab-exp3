<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gadget Finder – Experiment 3 | Input &amp; Forms</title>
  <meta name="description" content="Flutter Lab Experiment 3: Gadget Finder – search, dropdown, slider, form validation and add-to-cart." />
  <style>
    :root {
      --paper: #F6EFE6; --ink: #2B2A33; --terra: #D9593D; --sage: #5B8E7D;
      --card: #FFFBF6; --muted: #8A8478; --line: #E9DFD0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #e7dccb; color: var(--ink);
      min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center;
    }
    .phone {
      width: 390px; max-width: 100%; height: 800px; background: var(--paper);
      border: 8px solid #1c1b22; border-radius: 34px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      box-shadow: 0 24px 60px rgba(43,42,51,.35);
    }
    .app-bar { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 8px; flex-shrink: 0; }
    .title { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
    .bag { position: relative; font-size: 24px; }
    .bag .n {
      position: absolute; top: -6px; right: -10px; background: var(--terra); color: #fff;
      font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; display: none;
    }
    .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 24px; scrollbar-width: thin; scrollbar-color: #d8c9b3 transparent; }

    /* Form panel */
    form { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .field { position: relative; }
    .field input, .field select {
      width: 100%; background: var(--card); border: 1px solid #E2D8C9; border-radius: 14px;
      padding: 13px 14px 13px 42px; font-size: 14px; color: var(--ink); outline: none; appearance: none;
    }
    .field input:focus, .field select:focus { border: 1.6px solid var(--terra); padding: 12.4px 13.4px 12.4px 41.4px; }
    .field .ico { position: absolute; left: 13px; top: 12px; font-size: 16px; }
    .field.err input { border-color: #c0392b; }
    .error { color: #c0392b; font-size: 12px; margin: 4px 0 0 14px; min-height: 0; }
    .price-row { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
    .price-pill { background: rgba(217,89,61,.12); color: var(--terra); font-weight: 800; border-radius: 10px; padding: 3px 10px; }
    input[type=range] { width: 100%; accent-color: var(--terra); }
    .buttons { display: flex; gap: 10px; }
    .buttons button {
      flex: 1; padding: 13px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .apply { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .reset { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

    .summary { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 10px; }
    .summary b { font-size: 15px; }
    .summary span { font-size: 12px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .p-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
    .thumb { height: 70px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 8px; background: color-mix(in srgb, var(--c) 14%, transparent); }
    .p-name { font-weight: 800; font-size: 15px; }
    .p-cat { font-size: 11px; color: var(--muted); }
    .p-row { display: flex; justify-content: space-between; margin: 6px 0 10px; font-size: 13px; }
    .p-price { font-weight: 800; color: var(--terra); }
    .p-rate { font-size: 11px; color: var(--muted); }
    .add { background: var(--sage); color: #fff; border: none; border-radius: 10px; padding: 9px 0; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: auto; }
    .add:active { transform: scale(.96); }
    .empty { text-align: center; color: var(--muted); font-weight: 600; padding: 40px 0; grid-column: 1 / -1; }

    .snack {
      position: absolute; left: 16px; right: 16px; bottom: 16px; background: var(--ink); color: #fff;
      padding: 12px 16px; border-radius: 12px; font-size: 13px; transform: translateY(80px);
      transition: transform .3s ease; z-index: 5;
    }
    .snack.show { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bar">
      <div class="title">Gadget Finder</div>
      <div class="bag">🛍️<span class="n" id="cartN">0</span></div>
    </div>

    <div class="scroll">
      <form id="form" novalidate>
        <div>
          <div class="field" id="searchField">
            <span class="ico">🔍</span>
            <input id="search" type="text" placeholder="Search gadgets…" autocomplete="off" />
          </div>
          <div class="error" id="searchErr"></div>
        </div>

        <div class="field">
          <span class="ico">🗂️</span>
          <select id="category">
            <option>All</option><option>Electronics</option><option>Accessories</option><option>Fashion</option>
          </select>
        </div>

        <div>
          <div class="price-row"><span>Max price</span><span class="price-pill" id="priceLabel">₹1,00,000</span></div>
          <input id="price" type="range" min="0" max="100000" step="5000" value="100000" />
        </div>

        <div class="buttons">
          <button type="submit" class="apply">✓ Apply</button>
          <button type="button" class="reset" id="reset">↺ Reset</button>
        </div>
      </form>

      <div class="summary"><b id="count"></b><span id="upto"></span></div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="snack" id="snack"></div>
  </div>

<script>
  const catalogue = [
    { name: 'Laptop',      cat: 'Electronics', price: 75000, rating: 4.5, icon: '💻', c: '#3D5A80' },
    { name: 'Smartphone',  cat: 'Electronics', price: 55000, rating: 4.7, icon: '📱', c: '#7B5EA7' },
    { name: 'Headphones',  cat: 'Electronics', price: 8000,  rating: 4.3, icon: '🎧', c: '#2A9D8F' },
    { name: 'Smart Watch', cat: 'Electronics', price: 22000, rating: 4.4, icon: '⌚', c: '#E76F51' },
    { name: 'Camera',      cat: 'Electronics', price: 45000, rating: 4.6, icon: '📷', c: '#BC4749' },
    { name: 'Tablet',      cat: 'Electronics', price: 35000, rating: 4.2, icon: '📟', c: '#5B8E7D' },
    { name: 'Sneakers',    cat: 'Fashion',     price: 4500,  rating: 4.1, icon: '👟', c: '#F4A261' },
    { name: 'Backpack',    cat: 'Fashion',     price: 2500,  rating: 4.0, icon: '🎒', c: '#8D6E63' },
    { name: 'Sunglasses',  cat: 'Fashion',     price: 1800,  rating: 4.0, icon: '🕶️', c: '#E9C46A' },
    { name: 'Keyboard',    cat: 'Accessories', price: 3500,  rating: 4.4, icon: '⌨️', c: '#4A5568' },
    { name: 'Mouse',       cat: 'Accessories', price: 1500,  rating: 4.2, icon: '🖱️', c: '#6C757D' },
    { name: 'USB Hub',     cat: 'Accessories', price: 2000,  rating: 3.9, icon: '🔌', c: '#588157' },
  ];
  const $ = id => document.getElementById(id);
  const inr = n => '₹' + n.toLocaleString('en-IN');
  let cart = 0, snackTimer;

  function toast(msg) {
    $('snack').textContent = msg; $('snack').classList.add('show');
    clearTimeout(snackTimer); snackTimer = setTimeout(() => $('snack').classList.remove('show'), 1400);
  }

  // Same rule as the Dart validator
  function validate() {
    const v = $('search').value.trim();
    let msg = '';
    if (v && v.length < 2) msg = 'Type at least 2 characters';
    else if (v && !/^[a-zA-Z0-9 ]+$/.test(v)) msg = 'Only letters, numbers and spaces';
    $('searchErr').textContent = msg;
    $('searchField').classList.toggle('err', !!msg);
    return !msg;
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const cat = $('category').value, max = +$('price').value;
    const shown = catalogue.filter(p =>
      (!q || p.name.toLowerCase().includes(q)) && (cat === 'All' || p.cat === cat) && p.price <= max);
    $('priceLabel').textContent = inr(max);
    $('count').textContent = `${shown.length} of ${catalogue.length} gadgets`;
    $('upto').textContent = 'up to ' + inr(max);
    $('grid').innerHTML = shown.length ? shown.map((p, i) => `
      <div class="p-card">
        <div class="thumb" style="--c:${p.c}">${p.icon}</div>
        <div class="p-name">${p.name}</div><div class="p-cat">${p.cat}</div>
        <div class="p-row"><span class="p-price">${inr(p.price)}</span><span class="p-rate">★ ${p.rating}</span></div>
        <button class="add" data-i="${i}">Add to cart</button>
      </div>`).join('') : '<div class="empty">🔎<br>Nothing matches those filters</div>';
    $('grid').querySelectorAll('.add').forEach(b => b.onclick = () => {
      cart++; $('cartN').textContent = cart; $('cartN').style.display = 'block';
      toast(shown[+b.dataset.i].name + ' added to cart');
    });
  }

  ['search', 'category', 'price'].forEach(id => $(id).addEventListener('input', () => { if (id === 'search') validate(); render(); }));
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    if (validate()) { render(); toast('Filters applied'); }
  });
  $('reset').onclick = () => {
    $('search').value = ''; $('category').value = 'All'; $('price').value = 100000;
    validate(); render(); toast('Filters reset');
  };
  render();
</script>
</body>
</html>
